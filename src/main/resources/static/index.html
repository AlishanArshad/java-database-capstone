<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Select Your Role</title>

    <!-- Favicon -->
    <link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Utility JavaScript -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>

    <!-- Component JavaScript -->
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>

<body>

    <main>
        <div class="container">

            <div class="wrapper">

                <!-- Header -->
                <div id="header"></div>

                <!-- Main Content -->
                <main class="main-content">

                    <h2>Select Your Role</h2>

                    <div class="role-buttons">
                        <button id="adminBtn" onclick="selectRole('admin')">
                            Admin
                        </button>

                        <button id="doctorBtn" onclick="selectRole('doctor')">
                            Doctor
                        </button>

                        <button id="patientBtn" onclick="selectRole('patient')">
                            Patient
                        </button>
                    </div>

                </main>

                <!-- Footer -->
                <div id="footer"></div>

            </div>

        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">

            <button id="closeModal" type="button">
                &times;
            </button>

            <div id="modal-body"></div>

        </div>
    </div>

    <!-- Role Selection Service -->
    <script type="module" src="../js/services/index.js" defer></script>

</body>
</html>
