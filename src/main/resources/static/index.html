<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Role</title>

    <!-- Favicon -->
    <link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon">

    <!-- CSS Links -->
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Utility JavaScript -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>

    <!-- Component JavaScript -->
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="wrapper">

            <!-- Header -->
            <div id="header"></div>

            <!-- Main Content -->
            <main class="main-content">
                <h2>Select Your Role</h2>

                <div class="role-buttons">
                    <button id="adminBtn" class="button">Admin</button>
                    <button id="doctorBtn" class="button">Doctor</button>
                    <button id="patientBtn" class="button">Patient</button>
                </div>
            </main>

            <!-- Footer -->
            <div id="footer"></div>

        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button id="closeModal" type="button">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Role Selection Service Module -->
    <script type="module" src="./js/services/index.js" defer></script>
</body>

</html>
